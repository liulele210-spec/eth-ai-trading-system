name: Binance Network Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Binance API endpoints
        run: |
          echo "======================================"
          echo "Binance Network Diagnostic"
          echo "======================================"
          echo ""

          test_endpoint() {
            NAME="$1"
            URL="$2"

            echo "--------------------------------------"
            echo "Testing: $NAME"
            echo "URL: $URL"

            BODY_FILE="/tmp/binance_test_body"

            HTTP_CODE=$(curl \
              -L \
              -sS \
              --max-time 15 \
              -o "$BODY_FILE" \
              -w "%{http_code}" \
              "$URL" || true)

            echo "HTTP Status: $HTTP_CODE"

            if [ -f "$BODY_FILE" ]; then
              echo "Response:"
              head -c 500 "$BODY_FILE"
              echo
            fi

            echo ""
          }

          test_endpoint \
            "Binance Futures" \
            "https://fapi.binance.com/fapi/v1/ping"

          test_endpoint \
            "Binance Spot" \
            "https://api.binance.com/api/v3/ping"

          test_endpoint \
            "Binance Data API" \
            "https://data-api.binance.vision/api/v3/ping"

          echo "======================================"
          echo "Diagnostic completed"
          echo "======================================"