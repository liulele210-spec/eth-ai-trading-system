name: ETH AI Trading System

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

jobs:
  eth-monitor:

    runs-on: ubuntu-latest

    steps:

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 ETH AI 分析
        run: |
          python -m src.main